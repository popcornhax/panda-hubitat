# Copy to firmware/secrets.yaml and replace every value. Do not commit it.
wifi_ssid: "replace-with-2.4ghz-wifi-name"
wifi_password: "replace-with-wifi-password"

# Generate with: openssl rand -base64 32
# ESPHome encrypted OTA uses this key without requiring the native API.
panda_ota_key: "replace-with-base64-encoded-32-byte-key"

# Hubitat Maker API discovery and dashboard. Replace after creating the app.
hubitat_host: "192.168.1.10"
app_id: "123"
access_token: "replace-with-maker-api-access-token"
