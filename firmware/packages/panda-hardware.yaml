esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf
    advanced:
      execute_from_psram: true
    sdkconfig_options:
      CONFIG_ESPTOOLPY_FLASHSIZE_16MB: y
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: y

psram:
  mode: octal
  speed: 80MHz

logger:
  level: INFO
  baud_rate: 115200
  hardware_uart: UART0

wifi:
  id: wifi_id
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  reboot_timeout: 0s

ota:
  - platform: esphome
    encryption:
      key: !secret panda_ota_key

i2c:
  id: touch_i2c
  sda: GPIO2
  scl: GPIO1
  frequency: 400kHz

output:
  - platform: ledc
    id: backlight_pwm
    pin: GPIO21
    frequency: 20000Hz

light:
  - platform: monochromatic
    id: backlight
    output: backlight_pwm
    restore_mode: RESTORE_DEFAULT_ON

display:
  - platform: mipi_rgb
    id: panel
    model: RPI
    dimensions:
      width: 800
      height: 480
    data_pins:
      red: [GPIO6, GPIO7, GPIO8, GPIO9, GPIO10]
      green: [GPIO11, GPIO12, GPIO13, GPIO14, GPIO15, GPIO16]
      blue: [GPIO17, GPIO18, GPIO48, GPIO47, GPIO39]
    de_pin: GPIO38
    pclk_pin: GPIO5
    reset_pin: GPIO46
    pclk_frequency: 14.8MHz
    pclk_inverted: true
    hsync_back_porch: 16
    hsync_front_porch: 16
    hsync_pulse_width: 0
    vsync_back_porch: 32
    vsync_front_porch: 32
    vsync_pulse_width: 0
    update_interval: never
    auto_clear_enabled: false
    color_order: RGB
    use_axis_flips: false
